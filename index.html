<body>
  <nav class="navbar">
    <div class="logo">ADT</div>

    <ul class="nav-links">
      <li><a href="#">Home</a></li>
      <li><a href="/community.html">Community Measures</a></li>
      <li><a href="/rules.html">Community guidelines</a></li>
    </ul>

    <button id="theme-toggle" class="toggle-btn">
      🌙
    </button>
  </nav>
  <style>
    /* Default (light mode) */
:root {
  --bg: #ffffff;
  --text: #1e1e1e;
  --nav-bg: #f5f5f5;
  --nav-text: #1e1e1e;
}

/* Dark mode overrides */
body.dark {
  --bg: #121212;
  --text: #e5e5e5;
  --nav-bg: #1e1e1e;
  --nav-text: #e5e5e5;
}

/* Apply variables */
body {
  background: var(--bg);
  color: var(--text);
  transition: background 0.3s, color 0.3s;
}

.navbar {
  background: var(--nav-bg);
  color: var(--nav-text);
  padding: 15px 30px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.nav-links a {
  color: var(--nav-text);
  margin-left: 20px;
  text-decoration: none;
  font-weight: 600;
}

.toggle-btn {
  background: none;
  border: 2px solid var(--nav-text);
  padding: 6px 12px;
  border-radius: 6px;
  cursor: pointer;
  color: var(--nav-text);
  font-size: 18px;
}
  </style>
  <script src="theme-toggling.js"></script>
</body>
